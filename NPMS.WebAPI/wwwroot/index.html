<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>New Product Management System (NPMS)</title>
  <link rel="stylesheet" href="style.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>

<div id="app-container">
  <!-- Left Navigation Sidebar -->
  <aside class="sidebar">
    <div class="sidebar-header">
      NPMS
    </div>
    <ul class="sidebar-menu">
      <li>
        <a href="#" class="active" id="nav-dashboard-link" onclick="switchView('list')">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2V6zM14 6a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2V6zM4 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2H6a2 2 0 01-2-2v-2zM14 16a2 2 0 012-2h2a2 2 0 012 2v2a2 2 0 01-2 2h-2a2 2 0 01-2-2v-2z"></path></svg>
          Dashboard
        </a>
      </li>
      <li>
        <a href="#" id="nav-settings-link" onclick="alert('Settings screen configured.')">
          <svg width="18" height="18" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10.325 4.317c.426-1.756 2.924-1.756 3.35 0a1.724 1.724 0 002.573 1.066c1.543-.94 3.31.826 2.37 2.37a1.724 1.724 0 001.065 2.572c1.756.426 1.756 2.924 0 3.35a1.724 1.724 0 00-1.066 2.573c.94 1.543-.826 3.31-2.37 2.37a1.724 1.724 0 00-2.572 1.065c-.426 1.756-2.924 1.756-3.35 0a1.724 1.724 0 00-2.573-1.066c-1.543.94-3.31-.826-2.37-2.37a1.724 1.724 0 00-1.065-2.572c-1.756-.426-1.756-2.924 0-3.35a1.724 1.724 0 001.066-2.573c-.94-1.543.826-3.31 2.37-2.37.996.608 2.296.07 2.572-1.065z"></path><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path></svg>
          Settings
        </a>
      </li>
    </ul>
    
    <div class="sidebar-footer">
      <div class="user-profile">
        <div class="user-avatar" id="sidebar-user-avatar">👤</div>
        <div class="user-info">
          <div class="user-name" id="sidebar-user-name">R&D User</div>
          <div class="user-role" id="sidebar-user-role">R&D Team</div>
        </div>
      </div>
      <button class="role-toggle-btn" onclick="toggleUserRole()">
        🔄 Switch Role (<span id="role-toggle-label">Non-R&D</span>)
      </button>
    </div>
  </aside>

  <!-- Main Viewport -->
  <div class="main-wrapper">
    <!-- Top Bar -->
    <header class="top-bar">
      <div class="top-title">New Product Management System</div>
      <div class="search-box">
        <span class="search-icon">🔍</span>
        <input type="text" id="top-search-input" placeholder="Search Part Number or Product Name..." onkeyup="handleTopSearch(event)">
      </div>
      <div class="top-actions">
        <div class="user-avatar-small" id="top-avatar-icon" title="Active Role">👤</div>
      </div>
    </header>

    <!-- Body Area -->
    <main class="content-body" id="main-content">
      <!-- Content dynamically injected via app.js -->
    </main>
  </div>
</div>

<!-- Document Upload Modal -->
<div class="modal-overlay" id="upload-modal">
  <div class="modal-container">
    <div class="modal-header">
      <h3>Upload Supporting Document</h3>
      <button class="modal-close" onclick="closeModal('upload-modal')">&times;</button>
    </div>
    <div class="modal-body">
      <form id="upload-doc-form">
        <div class="form-group">
          <label>Document Name</label>
          <input type="text" id="doc-name-input" class="form-control" placeholder="e.g. Work Instruction" required>
        </div>
        <div class="form-group">
          <label>Document Type</label>
          <select id="doc-type-input" class="form-control" required>
            <option value="Work Instruction">Work Instruction</option>
            <option value="Drawing">Drawing</option>
            <option value="Manufacturing Specification">Manufacturing Specification</option>
            <option value="Inspection Standard">Inspection Standard</option>
            <option value="Other">Other</option>
          </select>
        </div>
        <div class="form-group">
          <label>Revision</label>
          <input type="text" id="doc-rev-input" class="form-control" value="Rev.01" required>
        </div>
        <div class="form-group">
          <label>Select File (PDF, Word, Excel, Image)</label>
          <input type="file" id="doc-file-input" class="form-control" required>
        </div>
      </form>
    </div>
    <div class="modal-footer">
      <button class="btn btn-outline" onclick="closeModal('upload-modal')">Cancel</button>
      <button class="btn btn-primary" onclick="submitDocumentUpload()">Upload Document</button>
    </div>
  </div>
</div>

<script src="app.js"></script>
</body>
</html>
